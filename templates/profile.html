<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - RecipeHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand text-success" href="#"><i class="bi bi-journal-richtext"></i> RecipeHub</a>
            <div class="ms-auto">
                <a class="btn btn-outline-light btn-sm" href="#">Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-fill">
        <div class="row">
            <!-- Profile Info & Edit Form -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm p-4 text-center border-0">
                    <div class="mb-3">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb" class="rounded-circle shadow-sm" width="120" height="120" style="object-fit: cover;" alt="Profile Picture">
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Nino</h3>
                    <p class="text-muted small mb-4">nino@example.com</p>
                    
                    <hr>
                    
                    <h5 class="fw-semibold text-start mb-3 text-secondary">Edit Profile</h5>
                    <form>
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" class="form-control" value="Nino">
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" class="form-control" value="nino@example.com">
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label small fw-semibold">Profile Picture URL</label>
                            <input type="text" class="form-control" placeholder="https://...">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-sm fw-semibold">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- User's Recipes List -->
            <div class="col-lg-8">
                <div class="card shadow-sm p-4 border-0">
                    <h4 class="fw-bold text-dark mb-4">My Added Recipes</h4>
                    
                    <div class="list-group list-group-flush">
                        <!-- Recipe Item 1 -->
                        <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div>
                                <h5 class="mb-1 fw-semibold">Classic Italian Lasagna</h5>
                                <small class="text-muted">Added on: 2026-09-02 | Category: Dinner</small>
                            </div>
                            <div>
                                <a href="#" class="btn btn-outline-dark btn-sm me-1"><i class="bi bi-eye"></i></a>
                                <a href="#" class="btn btn-outline-warning btn-sm me-1"><i class="bi bi-pencil"></i></a>
                                <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                        <!-- Recipe Item 2 -->
                        <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div>
                                <h5 class="mb-1 fw-semibold">Chocolate Lava Cake</h5>
                                <small class="text-muted">Added on: 2026-08-25 | Category: Dessert</small>
                            </div>
                            <div>
                                <a href="#" class="btn btn-outline-dark btn-sm me-1"><i class="bi bi-eye"></i></a>
                                <a href="#" class="btn btn-outline-warning btn-sm me-1"><i class="bi bi-pencil"></i></a>
                                <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-muted text-center py-4">
        <div class="container"><p class="mb-0">&copy; 2026 RecipeHub</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
