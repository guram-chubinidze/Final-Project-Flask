<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Recipe - RecipeHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand text-success" href="#"><i class="bi bi-journal-richtext"></i> RecipeHub</a>
            <div class="ms-auto">
                <a class="btn btn-outline-light btn-sm" href="#">Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-fill">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm p-4 border-0 rounded-4">
                    <h2 class="fw-bold text-dark mb-4">Add New Recipe</h2>
                    
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Recipe Title</label>
                            <input type="text" class="form-control" placeholder="e.g., Classic Italian Lasagna">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold small text-secondary">Category</label>
                                <select class="form-select">
                                    <option selected>Choose category...</option>
                                    <option value="breakfast">Breakfast</option>
                                    <option value="lunch">Lunch</option>
                                    <option value="dinner">Dinner</option>
                                    <option value="dessert">Dessert</option>
                                    <option value="vegan">Vegan</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold small text-secondary">Prep & Cook Time</label>
                                <input type="text" class="form-control" placeholder="e.g., 45 mins">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold small text-secondary">Servings</label>
                                <input type="number" class="form-control" placeholder="e.g., 4">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold small text-secondary">Image URL</label>
                                <input type="url" class="form-control" placeholder="https://image-link.com">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">YouTube Video URL (Optional)</label>
                            <input type="url" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Short Description</label>
                            <textarea class="form-control" rows="2" placeholder="Brief summary of the recipe..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-secondary">Full Recipe / Instructions</label>
                            <textarea class="form-control" rows="6" placeholder="Step-by-step instructions and ingredients list..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="#" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-success px-4 fw-semibold">Publish Recipe</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-muted text-center py-4">
        <div class="container"><p class="mb-0">&copy; 2026 RecipeHub</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
