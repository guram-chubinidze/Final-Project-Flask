<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RecipeHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg p-4 border-0 rounded-4">
                    <div class="text-center mb-4">
                        <a href="#" class="text-success text-decoration-none fs-4 fw-bold"><i class="bi bi-journal-richtext"></i> RecipeHub</a>
                        <h2 class="fw-bold text-dark mt-2">Create an Account</h2>
                        <p class="text-muted small">Join our community and share your favorite recipes</p>
                    </div>
                    
                    <form>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Full Name / Username</label>
                            <input type="text" class="form-control" placeholder="e.g., Nino">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Email Address</label>
                            <input type="email" class="form-control" placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Password</label>
                            <input type="password" class="form-control" placeholder="••••••••">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold">Confirm Password</label>
                            <input type="password" class="form-control" placeholder="••••••••">
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-success py-2 fw-semibold">Register</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="text-muted small mb-0">Already have an account? <a href="#" class="text-success text-decoration-none fw-semibold">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
