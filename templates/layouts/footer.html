<footer class="bg-white border-top text-muted py-4 mt-auto shadow-sm">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
        
        <!-- მარცხენა მხარე: საავტორო უფლება და მოტრიალე Flask SVG -->
        <div class="d-flex align-items-center gap-2">
            <!-- მოტრიალე Flask SVG იკონკა -->
            <svg class="rotating-flask text-success" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 2v7.31L4.09 19.1A2 2 0 0 0 5.8 22h12.4a2 2 0 0 0 1.71-2.9L14 9.31V2"></path>
                <line x1="8.5" y1="2" x2="15.5" y2="2"></line>
                <line x1="7" y1="12" x2="17" y2="12"></line>
            </svg>
            <small class="text-secondary">&copy; 2026 <strong>RecipeHub</strong>. Built with Flask.</small>
        </div>
        
        <!-- მარჯვენა მხარე: GitHub-ის ლინკი ეფექტით -->
        <div class="d-flex align-items-center gap-3">
            <a href="https://github.com/guram-chubinidze" target="_blank" 
               class="text-decoration-none text-secondary d-flex align-items-center gap-1 github-link">
                <i class="bi bi-github fs-5"></i>
                <small class="fw-semibold">GitHub</small>
            </a>
        </div>
    </div>
</footer>
